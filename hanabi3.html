function renderCandidates(){candidateGrid.innerHTML="";candidateGrid.style.gridTemplateColumns=`repeat(${count},minmax(0,1fr))`;candidates=candidates.slice(0,count);while(candidates.length<count)candidates.push(newCandidate());candidates.forEach((c,i)=>{const slot=document.createElement("div");slot.className="candidate-slot";const label=document.createElement("div");label.className="candidate-label";label.textContent=(i+1)+"枚目";const cb=document.createElement("button");cb.className="candidate-picker";cb.dataset.index=i;cb.dataset.kind="colors";cb.setAttribute("aria-haspopup","dialog");cb.innerHTML='<span class="picker-summary"></span><span class="picker-arrow">▼</span>';cb.querySelector(".picker-summary").textContent=c.colors.length?c.colors.join("・"):"色を選択";cb.onclick=()=>openCandidatePicker(cb,i,"colors");const nb=document.createElement("button");nb.className="candidate-picker";nb.dataset.index=i;nb.dataset.kind="numbers";nb.setAttribute("aria-haspopup","dialog");nb.innerHTML='<span class="picker-summary"></span><span class="picker-arrow">▼</span>';nb.querySelector(".picker-summary").textContent=c.numbers.length?c.numbers.join("・"):"数字を選択";nb.onclick=()=>openCandidatePicker(nb,i,"numbers");const status=document.createElement("button");status.className="negate-btn";status.textContent="候補状況";status.onclick=openStatusModal;slot.append(label,cb,nb,status);candidateGrid.appendChild(slot)})}
function openStatusModal(){closePicker();statusContent.innerHTML="";let any=false;const candidateOrder=Array.from({length:count},(_,i)=>i);candidateOrder.forEach((i,displayIndex)=>{const c=candidates[i];const card=document.createElement("div");card.className="status-card";const title=document.createElement("div");title.className="status-card-title";title.textContent=`${i+1}枚目`;card.appendChild(title);const colorLine=document.createElement("div");colorLine.className="status-row";colorLine.append("色：");if(c.colors.length){c.colors.forEach((v,j)=>{if(j)colorLine.append(document.createTextNode(" ／ "));const s=document.createElement("span");s.textContent=v;if((c.negatedColors||[]).includes(v)){s.className="status-neg";s.textContent+="（否定）"}colorLine.appendChild(s)})}else colorLine.append("未設定");const numLine=document.createElement("div");numLine.className="status-row";numLine.append("数字：");if(c.numbers.length){c.numbers.forEach((v,j)=>{if(j)numLine.append(document.createTextNode(" ／ "));const s=document.createElement("span");s.textContent=v;if((c.negatedNumbers||[]).includes(v)){s.className="status-neg";s.textContent+="（否定）"}numLine.appendChild(s)})}else numLine.append("未設定");if(c.colors.length||c.numbers.length)any=true;card.append(colorLine,numLine);statusContent.appendChild(card)});if(!any){const empty=document.createElement("div");empty.className="status-empty";empty.textContent="候補メモはまだ設定されていません。";statusContent.prepend(empty)}statusModal.hidden=false}
function render(){closePicker();renderHands();renderCandidates()}orientationBtn.onclick=()=>{orientationMode=orientationMode==="number"?"card":"number";renderHands()};countBtn.onclick=()=>{endEditSession();if(gameInProgress()){alert("ゲーム進行中は手札枚数を変更できません。先に「リセット」を押してください。");return}count=count===5?4:count===4?3:5;hand=hand.slice(0,count);while(hand.length<count)hand.push(newCard());candidates=candidates.slice(0,count);while(candidates.length<count)candidates.push(newCandidate());undoHistory=[];redoHistory=[];selectedIndex=Math.min(selectedIndex,count-1);render()};shiftBtn.onclick=()=>{endEditSession();if(!hand.length)return;saveUndo();hand.splice(selectedIndex,1);hand.push(newCard());candidates.splice(selectedIndex,1);candidates.push(newCandidate());/* 左端補充に変更する場合は push を unshift に変更 */selectedIndex=Math.min(selectedIndex,hand.length-1);render()};undoBtn.onclick=()=>{endEditSession();if(!undoHistory.length)return;redoHistory.push(snapshot());restore(undoHistory.pop());render()};redoBtn.onclick=()=>{endEditSession();if(!redoHistory.length)return;undoHistory.push(snapshot());if(undoHistory.length>2)undoHistory.shift();restore(redoHistory.pop());render()};resetBtn.onclick=()=>{endEditSession();saveUndo();hand=Array.from({length:count},newCard);selectedIndex=0;render()};$("clearCandidates").onclick=()=>{saveUndo();candidates=Array.from({length:count},newCandidate);render()};$("closeStatusBtn").onclick=closeStatus;statusModal.addEventListener("click",e=>{if(e.target===statusModal)closeStatus()});document.addEventListener("pointerdown",e=>{if(openPicker&&!pickerPopup.contains(e.target)&&!openPicker.anchor.contains(e.target))closePicker()});window.addEventListener("resize",()=>{if(openPicker&&!pickerPopup.hidden)positionPicker(openPicker.anchor)});window.addEventListener("scroll",()=>{if(openPicker&&!pickerPopup.hidden)positionPicker(openPicker.anchor)},true);document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePicker();closeStatus()}});setInterval(()=>{animationTick++;document.querySelectorAll(".animated-number").forEach(el=>{const vals=(el.dataset.values||"").split(",").filter(Boolean);if(vals.length)el.textContent=vals[animationTick%vals.length]})},1000);const root=document.documentElement;function updateLayout(){const v=window.visualViewport;root.style.setProperty("--app-height",Math.max(v?v.height:innerHeight,200)+"px")}window.addEventListener("resize",updateLayout);if(window.visualViewport)window.visualViewport.addEventListener("resize",updateLayout);updateLayout();render();
</script></body></html>
