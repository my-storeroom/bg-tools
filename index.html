<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ツール一覧</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #263238;
      --muted: #607078;
      --line: #d9e0e5;
      --accent: #247a8b;
      --accent-hover: #195e6b;
      --help-bg: #edf7f8;
      --help-line: #c8e3e7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(1.6rem, 6vw, 2rem);
      letter-spacing: 0.03em;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }

    .tool-list {
      display: grid;
      gap: 20px;
    }

    /* ツール本体とヘルプを1つのグループにまとめる */
    .tool-group {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgb(24 39 48 / 6%);
    }

    .tool-main {
      padding: 20px;
    }

    .tool-main h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .tool-main p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tool-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .tool-link:hover,
    .tool-link:focus-visible {
      background: var(--accent-hover);
    }

    .tool-link:focus-visible,
    .help-link:focus-visible {
      outline: 3px solid #8bd1df;
      outline-offset: 3px;
    }

    .tool-help {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: var(--help-bg);
      border-top: 1px solid var(--help-line);
    }

    .help-copy {
      min-width: 0;
    }

    .help-label {
      display: block;
      margin-bottom: 2px;
      color: var(--accent-hover);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .help-description {
      color: var(--text);
      font-size: 0.88rem;
    }

    .help-link {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--help-line);
      border-radius: 9px;
      background: #fff;
      color: var(--accent-hover);
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .help-link:hover {
      background: #f7fcfc;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 0.8rem;
    }

    @media (max-width: 420px) {
      .tool-help {
        align-items: flex-start;
        flex-direction: column;
      }

      .help-link {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>ツール一覧</h1>
    <p class="intro">使いたいツールを選んでください。各ツールの使い方は、そのツールのすぐ下から確認できます。</p>

    <section class="tool-list" aria-label="ツール一覧">
      <!-- 新しいツールを追加するときは、tool-group全体を複製してください。
           tool-main内の名前・説明・起動リンクと、tool-help内の説明・ヘルプリンクを
           それぞれ追加するツールに合わせて変更すると、ツールとヘルプをセットで登録できます。 -->

      <article class="tool-group">
        <div class="tool-main">
          <h2>🎆 HANABI用メモ帳</h2>
          <p>手札の色や数字、相手向け表示、推理メモを管理します。</p>
          <a class="tool-link" href="hanabi.html">HANABI用メモ帳を開く</a>
        </div>
        <div class="tool-help">
          <div class="help-copy">
            <span class="help-label">このツールのヘルプ</span>
            <div class="help-description">手札の入力方法、表示切り替え、カード補充ややり直し機能の説明です。</div>
          </div>
          <a class="help-link" href="hanabi-help.html">📖 使い方を見る</a>
        </div>
      </article>
    </section>

    <footer>各HTMLファイルは、この index.html と同じフォルダーに置いてください。</footer>
  </main>
</body>
</html>
